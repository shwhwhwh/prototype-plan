name: Register a derived project
description: Record a parent, preserved attribution and permission evidence for a derivative.
title: '[Derivative] '
body:
  - type: input
    id: project
    attributes:
      label: Derived project name, author and repository URL
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Immediate parent project ID and repository
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Full 40-character derivative commit SHA
    validations:
      required: true
  - type: input
    id: manifest
    attributes:
      label: Link to PROTOTYPE_ORIGIN.json at that commit
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Preserved licenses, attribution, changes and permission evidence
      description: Include all upstream ancestors. New RN/BC commercial use requires author approval; recorded historical MIT rights remain valid. Do not disclose private correspondence.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Provenance acknowledgement
      options:
        - label: I retain upstream attribution and license terms. This submission does not itself grant permission or transfer ownership.
          required: true

  - type: dropdown
    id: usage-scope
    attributes:
      label: Intended use scope
      options:
        - personal-study
        - noncommercial-experiment
        - contribution
        - commercial (separate authorization may be required)
        - owner-maintained (own rights only)
    validations:
      required: true
